name: e2e
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install the system under test (Actual Budget 26.10.0)
        run: mkdir sut && cd sut && npm i @actual-app/sync-server@26.10.0
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Journeys in parallel (one server per test)
        run: ACTUAL_DIR=sut pytest -n 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: artifacts/ }
